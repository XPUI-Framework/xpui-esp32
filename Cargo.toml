[package]
name = "xpui-esp32"
description = "The xpui gallery as ESP32 firmware, for the Xteink X3 and the Seeed Sticky"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Thiago Holanda <unnamedd@gmail.com>"]
repository = "https://github.com/XPUI-Framework/xpui-esp32"
readme = "README.md"
publish = false

[lints]
workspace = true

# `test`/`bench` off everywhere, as in `xpui-rp2040`: neither bare-metal
# target has libtest, so leaving them on makes `--all-targets` fail on the
# only targets this crate compiles for.
[lib]
name = "xpui_esp32"
path = "src/lib.rs"
test = false
bench = false

# One binary per board, and **each needs its own feature**, because the chip is
# a feature of `esp-hal` rather than a target: two binaries in one crate cannot
# select different ones on their own. `required-features` is what stops
# `cargo build --bins` trying to build both against whichever chip won.
[[bin]]
name = "x3"
path = "src/bin/x3.rs"
required-features = ["x3"]
test = false
bench = false

[[bin]]
name = "sticky"
path = "src/bin/sticky.rs"
required-features = ["sticky"]
test = false
bench = false

[features]
# **Exactly one board at a time.** `--all-features` enables both, which is two
# chips and two architectures; the build then fails inside
# `esp-metadata-generated` rather than here, because cargo compiles
# dependencies first. See the note in `src/lib.rs`.
#
# Xteink X3 — ESP32-C3, RISC-V, a target stable Rust has.
x3 = ["esp32c3"]
# Seeed Sticky — ESP32-S3, Xtensa, which stable Rust cannot target at all.
sticky = ["esp32s3"]

# The chip, threaded through every crate that needs to know it. Named
# separately from the board so a second board on the same chip is one line.
esp32c3 = [
  "esp-hal/esp32c3",
  "esp-alloc/esp32c3",
  "esp-backtrace/esp32c3",
  "esp-println/esp32c3",
  "esp-bootloader-esp-idf/esp32c3",
]
esp32s3 = [
  "esp-hal/esp32s3",
  "esp-alloc/esp32s3",
  "esp-backtrace/esp32s3",
  "esp-println/esp32s3",
  "esp-bootloader-esp-idf/esp32s3",
  # The peripheral access crate, pinned. See `[dependencies.esp32s3-pac]`.
  "dep:esp32s3-pac",
]

# Bare metal only: the gate builds every member for the host it runs on, and
# an ESP32 HAL does not compile for a laptop, so behind this cfg the
# dependencies are not even resolved there. `build.rs` turns on a matching
# `device` cfg and the source is gated to match.
[target.'cfg(target_os = "none")'.dependencies]
xpui = { git = "https://github.com/XPUI-Framework/xpui-framework", branch = "main" }
# The two vendors these binaries flash, and no others.
xpui-boards-core = { git = "https://github.com/XPUI-Framework/xpui-boards", branch = "main" }
xpui-boards-seeed = { git = "https://github.com/XPUI-Framework/xpui-boards", branch = "main" }
xpui-boards-xteink = { git = "https://github.com/XPUI-Framework/xpui-boards", branch = "main" }
# `critical-section` on for the same reason `xpui-rp2040` has it: this is a
# device, and an interrupt handler could plausibly reach the backend. The
# implementation comes from `esp-hal`, not from here.
xpui-embedded-graphics = { git = "https://github.com/XPUI-Framework/xpui-backends", branch = "main", features = ["critical-section"] }

# The screens. The same crate the desktop simulator runs, with nothing
# device-specific in it.
xpui-gallery = { git = "https://github.com/XPUI-Framework/xpui-gallery", branch = "main" }

embedded-graphics = "0.8"

# **The Xtensa peripheral access crate, pinned to an exact version.** Nothing
# here calls it; `esp-hal` 1.1.2 asks for `^0.35`, and `esp32s3` 0.35.3
# renamed two `RTC_CNTL` fields `esp-hal` calls, so `esp-hal` stops compiling
# with an error inside somebody else's crate. Declared here, renamed, because
# a bare `Cargo.lock` entry is undone by the next `cargo update`; the rename
# avoids the `esp32s3` feature above. Drop it when an `esp-hal` release names
# a newer PAC, and check that both images still link.
esp32s3-pac = { package = "esp32s3", version = "=0.35.2", optional = true }

# `unstable` for `esp_hal::delay`, which is behind that gate in 1.1. esp-hal
# says never to enable this in a *library* crate, because it leaks an unstable
# surface to dependants; this is a firmware nothing depends on.
esp-hal = { version = "1.1", features = ["unstable"] }
esp-alloc = "0.10"
# **`println` is not optional**: this crate's build script fails outright
# unless exactly one of `defmt` or `println` is enabled, and says so.
esp-backtrace = { version = "0.19", features = ["panic-handler", "println"] }
esp-println = "0.17"
# Supplies the application descriptor the second-stage bootloader looks for.
esp-bootloader-esp-idf = "0.5"

[workspace]
# `xtask` is the gate. A member rather than a separate workspace so one
# `cargo test` reaches its tests.
members = ["xtask"]

# Three lints the compiler does not deny on its own, denied in every workspace
# root so that the table is one passage. `too_long_first_doc_paragraph` is the
# one to watch: it is a nursery lint, off by default, so clippy may rename or
# retire it — and a name clippy no longer knows is an `unknown_lints` warning,
# which `-D warnings` turns into a red gate in every repository at once.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
too_long_first_doc_paragraph = "deny"

[workspace.lints.rustdoc]
unescaped_backticks = "deny"

# Size over speed: flash is the scarce resource, not cycles.
#
# `"z"` rather than `"s"`, and this is the profile that actually ships —
# whatever a dependency declares, the workspace at the top of the build wins.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# No `strip`: neither board has been run yet, and the first person to run one
# wants symbol names in a backtrace more than a smaller file on the host. It
# costs nothing on the part — a symbol table is in no loadable segment.
